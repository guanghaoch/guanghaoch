# Jekyll Site Configuration
title: Guanghao Chen
description: Personal website of Guanghao Chen, showcasing projects, blog posts, and contact information.
baseurl: ""
url: "https://guanghaoch.github.io"

# Author info
author:
  name: Guanghao Chen
  email: guanghao.ch@gmail.com

# Social links
github_username: guanghaoch
twitter_username: # your twitter username

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Minima header pages
header_pages:
  - index.md
  - about.md
  - gallery.md
  - contact.md

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
