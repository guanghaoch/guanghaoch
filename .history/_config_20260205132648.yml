# Jekyll Site Configuration
title: Guanghao Chen
description: Visual portfolio and showcase
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://guanghaoch.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
remote_theme: pages-themes/cayman@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
