# Jekyll Site Configuration
title: Guanghao Chen
tagline: Visual portfolio and showcase
description: >-
  A personal website showcasing my work in web development, 
  photography, and design.
url: "https://guanghaoch.github.io"

# Social media
github:
  username: guanghaoch
twitter:
  username: # your twitter username
social:
  name: Guanghao Chen
  email: your.email@example.com
  links:
    - https://github.com/guanghaoch

# Theme settings
theme_mode: # [light|dark]
avatar: /assets/images/avatar.jpg

# Build settings
markdown: kramdown
remote_theme: cotes2020/jekyll-theme-chirpy
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

paginate: 10
paginate_path: "/posts/page:num/"

# Timezone
timezone: America/Los_Angeles

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
