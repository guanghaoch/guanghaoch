<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col">
        <p class="feed-subscribe">
          <a href="{{ 'feed.xml' | relative_url }}">
            <svg class="svg-icon orange"><use xlink:href="{{ '/assets/minima-social-icons.svg#rss' | relative_url }}"></use></svg><span>Subscribe</span>
          </a>
        </p>
        <ul class="contact-list">
          <li class="p-name">{{ site.title | escape }}</li>
          <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="social-links">
      {%- if site.github_username -%}
        <a href="https://github.com/{{ site.github_username | cgi_escape | escape }}" title="GitHub">
          <svg class="svg-icon grey"><use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
        </a>
      {%- endif -%}
      {%- if site.twitter_username -%}
        <a href="https://twitter.com/{{ site.twitter_username | cgi_escape | escape }}" title="Twitter">
          <svg class="svg-icon grey"><use xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"></use></svg>
        </a>
      {%- endif -%}
    </div>

    <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #828282;">
      &copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.
    </p>
  </div>
</footer>
